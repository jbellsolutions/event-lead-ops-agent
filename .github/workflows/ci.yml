name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python scripts/verify_repo.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: |
          python -m venv /tmp/event-lead-ops-wheel-test
          /tmp/event-lead-ops-wheel-test/bin/pip install dist/*.whl
          /tmp/event-lead-ops-wheel-test/bin/event-lead-ops --db /tmp/wheel-test.sqlite3 init-db
